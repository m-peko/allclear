<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>compa</title>
    <link rel="icon" href="/logo.svg" />
    <link rel="stylesheet" href="/app.css" />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      try {
        var saved = localStorage.getItem('compa.theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.dataset.theme = saved;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <!-- See docs/logo.svg. Inline so the bar can take the theme's accent:
             amber is nearly invisible on the light background. -->
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="2" y="4" width="14" height="6" rx="3" fill="#7b7b86" />
          <rect x="2" y="13" width="14" height="6" rx="3" fill="#7b7b86" />
          <rect x="2" y="22" width="14" height="6" rx="3" fill="#7b7b86" />
          <rect x="20" y="3" width="10" height="26" rx="5" fill="var(--accent)" />
        </svg>
        <h1>compa</h1>
        <span id="conn" class="conn" data-state="connecting">connecting</span>
      </div>

      <div class="stats">
        <div class="stat"><strong id="stat-sessions">0</strong><span>sessions</span></div>
        <div class="stat"><strong id="stat-active">0</strong><span>active</span></div>
        <div class="stat"><strong id="stat-pending">0</strong><span>waiting</span></div>
      </div>

      <div class="controls">
        <button id="theme" class="icon-btn" title="Switch theme" aria-label="Switch theme">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <g class="icon-sun" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round">
              <circle cx="12" cy="12" r="4.2" />
              <path d="M12 2.4v2.2M12 19.4v2.2M2.4 12h2.2M19.4 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6" />
            </g>
            <path class="icon-moon" fill="currentColor"
                  d="M20.3 14.2A8.4 8.4 0 019.8 3.7a8.6 8.6 0 103.3 16.6 8.6 8.6 0 007.2-6.1z" />
          </svg>
        </button>

        <label class="toggle" title="Approve every request the moment it arrives, without showing it to you first.">
          <input type="checkbox" id="auto-approve" />
          <span class="track"><span class="thumb"></span></span>
          <span class="toggle-label">Auto-approve</span>
        </label>

        <button id="approve-all" class="btn btn-primary btn-lg" disabled>
          Approve all <kbd>A</kbd>
        </button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <section class="side-block">
          <h2>Idle <span id="idle-count" class="count"></span></h2>
          <ul id="idle-list" class="idle-list"></ul>
          <p id="idle-empty" class="sidebar-empty">Nothing idle.</p>
        </section>

        <section class="side-block">
          <h2>Recent decisions</h2>
          <ul id="activity" class="activity-list"></ul>
          <p id="activity-empty" class="sidebar-empty">Nothing decided yet.</p>
        </section>
      </aside>

      <main id="sessions" class="sessions"></main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
